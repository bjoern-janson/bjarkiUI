name: Package addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 and 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4
      - name: Verify current source and package
        run: |
          python3 tools/verify.py --output "$RUNNER_TEMP/bjarkiUI-verified.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/bjarkiUI-verified.zip" "$RUNNER_TEMP/bjarkiUI-package"
      - uses: actions/upload-artifact@v4
        with:
          name: bjarkiUI
          path: ${{ runner.temp }}/bjarkiUI-package
          if-no-files-found: error
